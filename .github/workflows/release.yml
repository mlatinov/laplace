# Compiler release: build the `laplace` binary for every supported platform
# and publish it to GitHub Releases when a `v*` tag is pushed.
#
# (Not to be confused with a *package* release -- `laplace release` tags a
# Stan library repository and never involves this workflow.)
#
# The asset layout is a contract with `laplace self-update` and the AUR
# `laplace-bin` package -- change all three together:
#   laplace-<target>.tar.gz          a `laplace-<target>/` directory holding
#                                    the binary, LICENSE, README.md, CHANGELOG.md
#   laplace-<target>.tar.gz.sha256   "<hex>  <file name>"
#   SHA256SUMS                       every .sha256 line, concatenated
#   install.sh                       the shell installer
#
# See RELEASING.md for the steps around it.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the tag with the package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi
      - name: Require a CHANGELOG entry
        shell: bash
        run: |
          grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [${GITHUB_REF_NAME#v}]' section"
            exit 1
          }

  build:
    name: Build ${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, test: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, test: true }
          - { target: aarch64-apple-darwin, os: macos-14, test: true }
          # Cross-compiled on Apple silicon: Intel macOS runners are being
          # retired, and the tests already ran on the arm64 build.
          - { target: x86_64-apple-darwin, os: macos-14, test: false }
          # The integration tests use Unix file permissions; the Windows
          # binary is built and smoke-tested, not run through the suite.
          - { target: x86_64-pc-windows-msvc, os: windows-latest, test: false }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        if: matrix.test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          exe="target/${{ matrix.target }}/release/laplace"
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
      - name: Package
        shell: bash
        run: |
          name="laplace-${{ matrix.target }}"
          mkdir "$name"
          if [ -f "target/${{ matrix.target }}/release/laplace.exe" ]; then
            cp "target/${{ matrix.target }}/release/laplace.exe" "$name/"
          else
            cp "target/${{ matrix.target }}/release/laplace" "$name/"
          fi
          cp LICENSE README.md CHANGELOG.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          cat "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: laplace-${{ matrix.target }}
          path: |
            laplace-${{ matrix.target }}.tar.gz
            laplace-${{ matrix.target }}.tar.gz.sha256

  publish:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and installer
        shell: bash
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          cp packaging/install.sh dist/install.sh
          ls -l dist
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "laplace ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag
