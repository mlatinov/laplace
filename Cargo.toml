[workspace]
# The root package stays the default: `cargo build` / `cargo install --path .`
# at the repo root still build only the `laplace` compiler.
members = [".", "laplace-sample"]
# Phase 0 spike crates carry their own [workspace] and are never members.
exclude = ["spikes"]

[package]
name = "laplace"
version = "0.2.0"
edition = "2021"

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
semver = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
