[workspace]
# The root package stays the default: `cargo build` / `cargo install --path .`
# at the repo root still build only the `laplace` compiler.
members = [".", "laplace-sample", "laplace-sampler-syntax"]
# Phase 0 spike crates carry their own [workspace] and are never members.
exclude = ["spikes"]

# One version for the compiler and laplace-sample, which are released
# together and move in lockstep (Q20): both packages inherit it. The release
# workflows read the first `version = "..."` line of this file, which is
# this one.
[workspace.package]
version = "0.3.0"

# laplace-sample's nuts-rs = "=0.19.1" is the vendored, patched copy (Q2,
# laplace-sample/vendor/VENDORED.md). A [patch] source is not a workspace
# member, so fmt and clippy leave the upstream code alone (a plain path
# dependency inside the workspace would be a member; `exclude` cannot
# change that).
[patch.crates-io]
nuts-rs = { path = "laplace-sample/vendor/nuts-rs-0.19.1" }

[package]
name = "laplace"
version.workspace = true
edition = "2021"

[dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
semver = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
