[package]
name = "laplace-sample"
version = "0.1.0"
edition = "2021"
description = "Optional custom-sampler runtime for laplace: runs a compiled .stan model through BridgeStan"
license = "MIT"
publish = false

[[bin]]
name = "laplace-sample"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# The compiler's library: laplace.lock, manifests and installed-package
# lookup, so kernel packages (Phase 4) resolve exactly as the package manager
# installed them. One-way: the compiler never links the sampler (D1).
laplace = { path = ".." }
nalgebra = "0.35"
pest = "2.9"
pest_derive = "2.9"
# Pinned together with BRIDGESTAN_VERSION in src/bridgestan_src.rs: the
# crate's FFI matches exactly one BridgeStan release's C header (D9).
bridgestan = "=2.9.0"
clap = { version = "4", features = ["derive"] }
# nuts-rs 0.19.1 plus Chain::refresh_position: the workspace root patches
# this to the in-repo copy in vendor/ (Q2, vendor/VENDORED.md); nuts() as one
# block of a sweep needs it (Phase 3.4).
nuts-rs = "=0.19.1"
rand = { version = "0.10", features = ["chacha"] }
rand_distr = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# tests/<kernel>.test.toml (laplace sampler test, Phase 5.1)
toml = "0.8"

[dev-dependencies]
tempfile = "3"
