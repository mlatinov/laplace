[package]
name = "sampler-phase0-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: never a member of the laplace compiler build (ground rule 5).
[workspace]

[dependencies]
bridgestan = "=2.9.0"
nuts-rs = "=0.19.1"
rand = { version = "0.10", features = ["chacha"] }
anyhow = "1"

# 0.5 experiment: nuts-rs 0.19.1 + one added method (Chain::refresh_position).
[patch.crates-io]
nuts-rs = { path = "vendor/nuts-rs-0.19.1" }
